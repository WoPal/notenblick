<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notenblick">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Notenblick – Familien-Notenmanager</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#69758a;--line:#e4e9f1;--accent:#3659d9;--accent2:#e9efff;--green:#16845b;--red:#c44949;--shadow:0 8px 30px rgba(25,45,90,.07);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;background:var(--accent);color:white;font-weight:650}button.secondary{background:#eef2f8;color:#23304b}button.ghost{background:transparent;color:var(--muted);padding:7px 10px}button.danger{background:#fff0f0;color:#a43131}button:hover{filter:brightness(.97)}.app{max-width:1160px;margin:auto;padding:22px 20px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#4469e8,#243ca6);display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800}.brand h1{margin:0;font-size:21px;letter-spacing:-.4px}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:245px 1fr;gap:20px}.sidebar,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.sidebar{padding:17px;height:max-content}.section-label{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:750;text-transform:uppercase;margin:2px 0 12px}.child-list{display:grid;gap:8px}.child-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent}.child-item.active{background:var(--accent2);border-color:#d5dfff}.avatar{width:34px;height:34px;border-radius:50%;background:#e5eaf7;color:#354c9c;display:grid;place-items:center;font-weight:750;flex:none}.child-item .name{font-weight:650}.child-item small{display:block;color:var(--muted);font-size:12px}.sidebar .full{width:100%;margin-top:12px}.sidebar-divider{border-top:1px solid var(--line);margin:17px 0}.main{min-width:0}.welcome{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.welcome h2{margin:0;font-size:24px;letter-spacing:-.6px}.welcome p{margin:4px 0 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{padding:16px 18px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:27px;font-weight:780;letter-spacing:-.6px;margin-top:3px}.stat .hint{font-size:12px;color:var(--muted);margin-top:2px}.content-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.card{padding:18px;margin-bottom:14px}.card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.card-header h3{margin:0;font-size:16px}.card-header small{color:var(--muted)}.subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.subject{border:1px solid var(--line);border-radius:13px;padding:12px;cursor:pointer;transition:.12s}.subject:hover,.subject.selected{border-color:#b8c8ff;background:#f8faff}.subject-name{font-weight:700}.subject-meta{color:var(--muted);font-size:12px;margin-top:3px}.subject-average{font-weight:800;font-size:20px;margin-top:8px}.grade-badge{display:inline-flex;padding:3px 7px;border-radius:8px;font-size:12px;font-weight:700;background:#f0f3f9;color:#42516b}.chart-card{min-height:260px}.chart-controls{display:flex;gap:7px;flex-wrap:wrap}.chart-controls select{max-width:190px}.chart-wrap{height:205px;margin-top:10px;position:relative}.chart-wrap svg{width:100%;height:100%;overflow:visible}.empty-chart{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}.grade-list{display:grid;gap:8px}.grade-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:12px}.grade-number{font-size:19px;font-weight:800;text-align:center}.grade-details strong{display:block;font-size:13px}.grade-details small{color:var(--muted)}.grade-note{font-size:12px;color:var(--muted);margin-top:2px}.row-actions{display:flex;gap:5px}.row-actions button{padding:5px 8px;font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select{width:auto;min-width:140px}.empty{padding:28px 16px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:4px}.modal-backdrop{position:fixed;inset:0;background:rgba(16,24,45,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-backdrop.show{display:flex}.modal{background:white;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.18);width:min(520px,100%);padding:22px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 17px;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea,select{border:1px solid #dce3ed;border-radius:10px;padding:10px;background:#fff;color:var(--text);min-width:0}.field textarea{resize:vertical;min-height:65px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.tabs{display:flex;gap:6px;background:#f1f4f9;padding:4px;border-radius:11px}.tab{background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px}.tab.active{background:white;color:var(--text);box-shadow:0 2px 8px #dce2ec}.footnote{color:var(--muted);font-size:12px;margin-top:10px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:10px 15px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}.no-child{padding:40px;text-align:center}.no-child h2{margin:0 0 8px}.no-child p{color:var(--muted);max-width:420px;margin:0 auto 18px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{padding:14px}.child-list{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.content-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:540px){.app{padding:14px 12px 30px}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions button{flex:1}.welcome{align-items:flex-start;flex-direction:column}.welcome h2{font-size:21px}.stats{gap:8px}.stat{padding:12px}.stat .value{font-size:22px}.subject-grid{grid-template-columns:1fr 1fr}.card{padding:14px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.grade-row{grid-template-columns:42px 1fr auto;gap:7px}.row-actions{flex-direction:column}.chart-controls select{flex:1;min-width:110px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">N</div><div><h1>Notenblick</h1><p>Dein Familien-Notenmanager</p></div></div>
    <div class="top-actions"><button id="addGradeTop">＋ Note eintragen</button><button class="secondary" id="exportBtn">Daten exportieren</button><button class="secondary" id="importBtn">Import</button><input id="importFile" type="file" accept="application/json" hidden></div>
  </header>
  <div class="layout">
    <aside class="sidebar"><div class="section-label">Kinder</div><div id="childList" class="child-list"></div><button class="secondary full" id="addChildBtn">＋ Kind hinzufügen</button><div class="sidebar-divider"></div><div class="section-label">Verwaltung</div><button class="ghost full" id="subjectsBtn">Fächer verwalten</button><button class="ghost full" id="editChildBtn">Kind bearbeiten</button></aside>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const DEFAULT_SUBJECTS=['Mathematik','Deutsch','Englisch','Sachkunde','Biologie','Geschichte','Geografie','Sport','Musik','Kunst'];
const TYPES=['Klassenarbeit','Test','Mündlich','Quartalsnote','Halbjahresnote','Jahresnote','Sonstige'];
const STORE='notenblick_data_v1';
let db=load();let activeChildId=db.children[0]?.id||null;let selectedSubject='';let range='all';let gradeTypeFilter='all';
let storageUnavailable=false;
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{children:[]}}catch{storageUnavailable=true;return{children:[]}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));storageUnavailable=false}catch{storageUnavailable=true}render();if(storageUnavailable)toast('Speicherung im Browser blockiert. Bitte regelmäßig „Daten exportieren“ nutzen')}
function uid(){return Math.random().toString(36).slice(2,10)}
function child(){return db.children.find(c=>c.id===activeChildId)}
function fmtDate(s){if(!s)return '';return new Date(s+'T12:00:00').toLocaleDateString('de-DE')}
function avg(arr){if(!arr.length)return null;return arr.reduce((a,b)=>a+b.grade,0)/arr.length}
function gradeText(n){return n==null?'–':n.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:2})}
function gradeColor(n){if(n<=2)return '#16845b';if(n<=3.5)return '#b27a1d';return '#c44949'}
function getFilteredGrades(c,subject=''){let list=(c?.grades||[]).filter(g=>!subject||g.subject===subject);const now=new Date();let cutoff=null;if(range==='4w'){cutoff=new Date();cutoff.setDate(now.getDate()-28)}else if(range==='3m'){cutoff=new Date();cutoff.setMonth(now.getMonth()-3)}else if(range==='quarter'){cutoff=new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3,1)}else if(range==='half'){cutoff=new Date(now.getFullYear(),now.getMonth()<6?0:6,1)}else if(range==='year'){cutoff=new Date(now.getFullYear(),0,1)}if(cutoff)list=list.filter(g=>new Date(g.date+'T12:00:00')>=cutoff);if(gradeTypeFilter!=='all')list=list.filter(g=>g.type===gradeTypeFilter);return list.sort((a,b)=>b.date.localeCompare(a.date))}
function render(){renderSidebar();const c=child();const main=document.getElementById('main');if(!c){main.innerHTML=`<div class="card no-child"><h2>Willkommen bei Notenblick</h2><p>Lege ein Kind an, um Fächer, Noten und die Entwicklung über die Zeit zu verwalten.</p><button id="welcomeAdd">＋ Erstes Kind anlegen</button></div>`;document.getElementById('welcomeAdd').onclick=()=>openChild();return}
const grades=c.grades||[];const assessed=grades.filter(g=>!['Quartalsnote','Halbjahresnote','Jahresnote'].includes(g.type));const overall=avg(assessed);const recent=getFilteredGrades(c).slice(0,5);
main.innerHTML=`<div class="welcome"><div><h2>${escapeHtml(c.name)}s Übersicht</h2><p>${escapeHtml(c.schoolClass||'')} ${c.schoolYear? '· '+escapeHtml(c.schoolYear):''}</p></div><button class="secondary" id="addGradeMain">＋ Note eintragen</button></div>
<div class="stats"><div class="card stat"><div class="label">Notendurchschnitt</div><div class="value" style="color:${overall?gradeColor(overall):'inherit'}">${gradeText(overall)}</div><div class="hint">Aus Tests, Arbeiten & mündlich</div></div><div class="card stat"><div class="label">Einträge gesamt</div><div class="value">${grades.length}</div><div class="hint">Alle Bewertungen</div></div><div class="card stat"><div class="label">Fächer</div><div class="value">${c.subjects.length}</div><div class="hint">Im Profil angelegt</div></div></div>
<div class="content-grid"><section><div class="card"><div class="card-header"><h3>Fächer</h3><small>Durchschnitt je Fach</small></div><div class="subject-grid" id="subjectGrid"></div></div><div class="card"><div class="card-header"><h3>Letzte Noten</h3><button class="ghost" id="showAllGrades">Alle anzeigen</button></div><div id="recentGrades" class="grade-list"></div></div></section>
<section><div class="card chart-card"><div class="card-header"><h3>Notenentwicklung</h3></div><div class="chart-controls"><select id="chartSubject"><option value="">Alle Fächer</option>${c.subjects.map(s=>`<option ${s===selectedSubject?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select><select id="chartRange"><option value="all">Gesamter Zeitraum</option><option value="4w">Letzte 4 Wochen</option><option value="3m">Letzte 3 Monate</option><option value="quarter">Aktuelles Quartal</option><option value="half">Aktuelles Halbjahr</option><option value="year">Dieses Schuljahr</option></select></div><div class="chart-wrap" id="chartWrap"></div><div class="footnote">Je niedriger die Note, desto besser. Quartals- und Zeugnisnoten werden separat in der Liste geführt.</div></div><div class="card"><div class="card-header"><h3>Notenliste</h3></div><div class="filters"><select id="listSubject"><option value="">Alle Fächer</option>${c.subjects.map(s=>`<option ${s===selectedSubject?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select><select id="listType"><option value="all">Alle Notenarten</option>${TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div><div id="allGrades" class="grade-list"></div></div></section></div>`;
renderSubjects(c);renderGradeLists(c);drawChart(c);
 document.getElementById('addGradeMain').onclick=()=>openGrade();document.getElementById('showAllGrades').onclick=()=>document.getElementById('allGrades').scrollIntoView({behavior:'smooth'});
 document.getElementById('chartSubject').onchange=e=>{selectedSubject=e.target.value;drawChart(c)};document.getElementById('chartRange').onchange=e=>{range=e.target.value;renderGradeLists(c);drawChart(c)};
 document.getElementById('listSubject').onchange=e=>{selectedSubject=e.target.value;renderGradeLists(c)};document.getElementById('listType').onchange=e=>{gradeTypeFilter=e.target.value;renderGradeLists(c)};
}
function renderSidebar(){const el=document.getElementById('childList');el.innerHTML=db.children.map(c=>`<div class="child-item ${c.id===activeChildId?'active':''}" data-id="${c.id}"><div class="avatar">${escapeHtml((c.name||'?').slice(0,1).toUpperCase())}</div><div><div class="name">${escapeHtml(c.name)}</div><small>${escapeHtml(c.schoolClass||'Klasse nicht angegeben')}</small></div>`).join('');el.querySelectorAll('.child-item').forEach(x=>x.onclick=()=>{activeChildId=x.dataset.id;selectedSubject='';gradeTypeFilter='all';range='all';render()});}
function renderSubjects(c){const el=document.getElementById('subjectGrid');el.innerHTML=c.subjects.map(s=>{const gs=(c.grades||[]).filter(g=>g.subject===s&&!['Quartalsnote','Halbjahresnote','Jahresnote'].includes(g.type));const a=avg(gs);return `<div class="subject ${selectedSubject===s?'selected':''}" data-sub="${escapeHtml(s)}"><div class="subject-name">${escapeHtml(s)}</div><div class="subject-meta">${gs.length} Leistungsnoten</div><div class="subject-average" style="color:${a?gradeColor(a):'var(--muted)'}">${gradeText(a)}</div></div>`}).join('');el.querySelectorAll('.subject').forEach(x=>x.onclick=()=>{selectedSubject=x.dataset.sub;document.getElementById('chartSubject').value=selectedSubject;document.getElementById('listSubject').value=selectedSubject;renderSubjects(c);renderGradeLists(c);drawChart(c)});}
function renderGradeLists(c){const rec=document.getElementById('recentGrades'),all=document.getElementById('allGrades');if(!rec||!all)return;let recent=(c.grades||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);rec.innerHTML=recent.length?recent.map(g=>gradeRow(g,false)).join(''):`<div class="empty">Noch keine Noten eingetragen.<br><button class="secondary" onclick="openGrade()" style="margin-top:10px">Erste Note eintragen</button></div>`;let subject=document.getElementById('listSubject')?.value||'';let type=document.getElementById('listType')?.value||'all';let filtered=getFilteredGrades(c,subject).filter(g=>type==='all'||g.type===type);all.innerHTML=filtered.length?filtered.map(g=>gradeRow(g,true)).join(''):`<div class="empty">Keine Noten für diese Auswahl.</div>`;all.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteGrade(b.dataset.delete));}
function gradeRow(g,allowDelete){return `<div class="grade-row"><div class="grade-number" style="color:${gradeColor(g.grade)}">${g.grade}</div><div class="grade-details"><strong>${escapeHtml(g.subject)} · ${escapeHtml(g.type)}</strong><small>${fmtDate(g.date)}${g.topic?' · '+escapeHtml(g.topic):''}</small>${g.note?`<div class="grade-note">${escapeHtml(g.note)}</div>`:''}</div>${allowDelete?`<div class="row-actions"><button class="danger" data-delete="${g.id}" title="Löschen">×</button></div>`:''}</div>`}
function drawChart(c){const wrap=document.getElementById('chartWrap');if(!wrap)return;const subj=document.getElementById('chartSubject')?.value||selectedSubject;let data=getFilteredGrades(c,subj).filter(g=>!['Quartalsnote','Halbjahresnote','Jahresnote'].includes(g.type)).sort((a,b)=>a.date.localeCompare(b.date));if(data.length<1){wrap.innerHTML='<div class="empty-chart">Noch keine Daten für das Diagramm.<br>Trage Noten ein, um die Entwicklung zu sehen.</div>';return}const w=wrap.clientWidth||340,h=200,pad={l:30,r:14,t:12,b:30},plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;const min=1,max=6;const x=i=>pad.l+(data.length===1?plotW/2:i/(data.length-1)*plotW);const y=n=>pad.t+(n-min)/(max-min)*plotH;let grid='';for(let n=1;n<=6;n++){let yy=y(n);grid+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${yy}" y2="${yy}" stroke="#e8edf4"/><text x="${pad.l-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#778397">${n}</text>`}let points=data.map((g,i)=>`${x(i)},${y(g.grade)}`).join(' ');let marks=data.map((g,i)=>`<circle cx="${x(i)}" cy="${y(g.grade)}" r="4" fill="#3659d9"><title>${escapeHtml(g.subject)} ${g.type}: ${g.grade} (${fmtDate(g.date)})</title></circle>`).join('');let ticks=data.length<=6?data.map((g,i)=>`<text x="${x(i)}" y="${h-7}" text-anchor="middle" font-size="10" fill="#778397">${escapeHtml(fmtDate(g.date).slice(0,5))}</text>`).join(''):data.map((g,i)=>i===0||i===data.length-1||i%Math.ceil(data.length/5)===0?`<text x="${x(i)}" y="${h-7}" text-anchor="middle" font-size="10" fill="#778397">${escapeHtml(fmtDate(g.date).slice(0,5))}</text>`:'').join('');wrap.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Notenverlauf">${grid}<polyline points="${points}" fill="none" stroke="#3659d9" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${marks}${ticks}</svg>`}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function openChild(existing=null){const c=existing?db.children.find(x=>x.id===existing):null;openModal(`<h2>${c?'Kind bearbeiten':'Kind hinzufügen'}</h2><form id="childForm"><div class="form-grid"><div class="field full"><label>Name</label><input name="name" required value="${escapeHtml(c?.name||'')}" placeholder="z. B. Alex"></div><div class="field"><label>Klasse</label><input name="schoolClass" value="${escapeHtml(c?.schoolClass||'')}" placeholder="z. B. 5b"></div><div class="field"><label>Schuljahr</label><input name="schoolYear" value="${escapeHtml(c?.schoolYear||'')}" placeholder="z. B. 2026/27"></div></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Abbrechen</button><button>Speichern</button></div></form>${c?'<button class="danger" style="margin-top:12px" id="deleteChild">Kind und Noten löschen</button>':''}`);document.getElementById('childForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(c){c.name=f.get('name').trim();c.schoolClass=f.get('schoolClass').trim();c.schoolYear=f.get('schoolYear').trim()}else{const n={id:uid(),name:f.get('name').trim(),schoolClass:f.get('schoolClass').trim(),schoolYear:f.get('schoolYear').trim(),subjects:DEFAULT_SUBJECTS.slice(),grades:[]};db.children.push(n);activeChildId=n.id}closeModal();save()};if(c)document.getElementById('deleteChild').onclick=()=>{if(confirm(`Soll ${c.name} wirklich mit allen Noten gelöscht werden?`)){db.children=db.children.filter(x=>x.id!==c.id);activeChildId=db.children[0]?.id||null;closeModal();save()}}}
function openGrade(){if(!child()){openChild();return}let today=new Date().toISOString().slice(0,10);const childOptions=db.children.map(ch=>`<option value="${ch.id}" ${ch.id===activeChildId?'selected':''}>${escapeHtml(ch.name)}${ch.schoolClass?' · '+escapeHtml(ch.schoolClass):''}</option>`).join('');openModal(`<h2>Note eintragen</h2><form id="gradeForm"><div class="field full" style="margin-bottom:12px"><label>Für welches Kind wird die Note eingetragen?</label><select name="childId" id="gradeChild" required>${childOptions}</select></div><div id="gradeChildBanner" style="background:#e9efff;border:1px solid #d5dfff;border-radius:12px;padding:11px 13px;margin-bottom:13px;font-weight:700;color:#243ca6"></div><div class="form-grid"><div class="field"><label>Fach</label><select name="subject" id="gradeSubject" required></select></div><div class="field"><label>Art der Note</label><select name="type">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="field"><label>Note</label><select name="grade" required>${[1,1.5,2,2.5,3,3.5,4,4.5,5,5.5,6].map(n=>`<option value="${n}">${n.toLocaleString('de-DE')}</option>`).join('')}</select></div><div class="field"><label>Datum</label><input type="date" name="date" value="${today}" required></div><div class="field full"><label>Thema / Anlass (optional)</label><input name="topic" placeholder="z. B. Bruchrechnung, Kapitel 3"></div><div class="field full"><label>Notiz (optional)</label><textarea name="note" placeholder="Zusätzliche Informationen"></textarea></div></div><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Abbrechen</button><button>Speichern</button></div></form>`);
const childSelect=document.getElementById('gradeChild'),subjectSelect=document.getElementById('gradeSubject'),banner=document.getElementById('gradeChildBanner');function updateGradeChild(){const selected=db.children.find(ch=>ch.id===childSelect.value);banner.textContent=selected?`👤 Note für ${selected.name}${selected.schoolClass?' · Klasse '+selected.schoolClass:''}`:'';subjectSelect.innerHTML=(selected?.subjects||[]).map(s=>`<option>${escapeHtml(s)}</option>`).join('');if(!selected?.subjects?.length)subjectSelect.innerHTML='<option value="">Bitte zuerst Fächer anlegen</option>'}childSelect.onchange=updateGradeChild;updateGradeChild();document.getElementById('gradeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const target=db.children.find(ch=>ch.id===f.get('childId'));if(!target)return toast('Bitte Kind auswählen');if(!target.subjects?.length)return toast('Bitte zuerst ein Fach für dieses Kind anlegen');target.grades=target.grades||[];target.grades.push({id:uid(),subject:f.get('subject'),type:f.get('type'),grade:Number(f.get('grade')),date:f.get('date'),topic:f.get('topic').trim(),note:f.get('note').trim()});activeChildId=target.id;closeModal();save();toast(`Note für ${target.name} gespeichert`)}}
function deleteGrade(id){const c=child();if(confirm('Diese Note löschen?')){c.grades=c.grades.filter(g=>g.id!==id);save();toast('Eintrag gelöscht')}}
function openSubjects(){const c=child();if(!c)return toast('Bitte zuerst ein Kind anlegen');openModal(`<h2>Fächer verwalten – ${escapeHtml(c.name)}</h2><div class="field"><label>Fächer (ein Fach pro Zeile)</label><textarea id="subjectsText" style="min-height:220px">${escapeHtml(c.subjects.join('\n'))}</textarea></div><div class="field" style="margin-top:12px"><label>Neues Fach hinzufügen</label><div style="display:flex;gap:8px"><input id="newSubjectInput" placeholder="z. B. Französisch" style="flex:1;min-width:0"><button type="button" id="addSubjectInline">＋ Hinzufügen</button></div></div><div class="footnote">Neue Fächer werden zur Liste ergänzt. Du kannst die Liste auch weiterhin direkt bearbeiten. Wenn du ein Fach entfernst, bleiben bereits gespeicherte Noten erhalten.</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button id="saveSubjects">Speichern</button></div>`);document.getElementById('addSubjectInline').onclick=()=>{const input=document.getElementById('newSubjectInput'),name=input.value.trim(),ta=document.getElementById('subjectsText');if(!name)return toast('Bitte einen Fachnamen eingeben');const existing=ta.value.split('\n').map(x=>x.trim().toLocaleLowerCase());if(existing.includes(name.toLocaleLowerCase()))return toast('Dieses Fach ist bereits in der Liste');ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+name;input.value='';input.focus();toast(`${name} hinzugefügt – noch Speichern drücken`)};document.getElementById('newSubjectInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('addSubjectInline').click()}};document.getElementById('saveSubjects').onclick=()=>{let arr=[...new Set(document.getElementById('subjectsText').value.split('\n').map(s=>s.trim()).filter(Boolean))];if(!arr.length)return toast('Mindestens ein Fach eingeben');c.subjects=arr;selectedSubject='';closeModal();save();toast('Fächer gespeichert')}}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='notenblick-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Export erstellt')}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.children))throw Error();if(confirm('Import ersetzt die aktuell gespeicherten Daten. Fortfahren?')){db=x;activeChildId=db.children[0]?.id||null;save();toast('Import abgeschlossen')}}catch{alert('Die Datei ist kein gültiger Notenblick-Export.')}};reader.readAsText(file)}
document.getElementById('addChildBtn').onclick=()=>openChild();document.getElementById('editChildBtn').onclick=()=>child()?openChild(activeChildId):toast('Bitte zuerst ein Kind anlegen');document.getElementById('subjectsBtn').onclick=openSubjects;document.getElementById('addGradeTop').onclick=openGrade;document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};
render();window.addEventListener('resize',()=>{const c=child();if(c)drawChart(c)});
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
